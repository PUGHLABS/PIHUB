[global]
   workgroup = WORKGROUP
   server string = PiVault NAS
   server role = standalone server

   # Security
   security = user
   map to guest = Never
   guest ok = No
   restrict anonymous = 2

   # Performance
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
   read raw = yes
   write raw = yes
   max xmit = 65535
   dead time = 15
   getwd cache = yes

   # Logging (minimal)
   log level = 1
   max log size = 5000

   # macOS compatibility
   fruit:aapl = yes
   fruit:model = RackMac
   vfs objects = fruit streams_xattr

# ── Shared NAS directory (jeff can read/write) ────────────────────────────────
[nas-shared]
   comment = PiVault Shared Storage
   path = /mnt/nas/nas/shared
   valid users = jeff
   read only = No
   writable = Yes
   create mask = 0664
   directory mask = 0775
   force group = jeff

# ── Jeff's private directory ──────────────────────────────────────────────────
[nas-jeff]
   comment = PiVault — Jeff's Private Storage
   path = /mnt/nas/nas/jeff
   valid users = jeff
   read only = No
   writable = Yes
   create mask = 0600
   directory mask = 0700
