services:

  # ──────────────────────────────────────────────
  # React frontend (Vite dev server)
  # ──────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001
    command: npm run dev -- --host
    restart: unless-stopped
    depends_on:
      - server

  # ──────────────────────────────────────────────
  # Node.js + Express API
  # ──────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
      # On the Pi: DB lives on the encrypted NAS drive.
      # For local dev, fall back to named volume via: docker-compose.override.yml
      - /mnt/nas/docker/server-data:/app/data
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - DB_PATH=/app/data/pivault.db
      - WX_API_KEY=${WX_API_KEY:-}
    command: npm run dev
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Nginx reverse proxy (HTTP + HTTPS)
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Samba NAS shares
  # ──────────────────────────────────────────────
  samba:
    image: lscr.io/linuxserver/samba:latest
    container_name: pivault-samba
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Los_Angeles}
    volumes:
      - /mnt/nas:/mnt/nas
      - ./docker/samba/smb.conf:/config/smb.conf:ro
    ports:
      - "445:445"
      - "137:137/udp"
      - "138:138/udp"
      - "139:139/tcp"
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # WireGuard VPN
  # ──────────────────────────────────────────────
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: pivault-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Los_Angeles}
      - SERVERURL=${WG_SERVERURL:-auto}
      - SERVERPORT=${WG_SERVERPORT:-51820}
      - PEERS=${WG_PEERS:-laptop,phone}
      - PEERDNS=${WG_PEERDNS:-auto}
      - INTERNAL_SUBNET=${WG_INTERNAL_SUBNET:-10.13.13.0}
      - ALLOWEDIPS=${WG_ALLOWEDIPS:-0.0.0.0/0}
      - PERSISTENTKEEPALIVE_PEERS=${WG_KEEPALIVE:-all}
      - LOG_CONFS=true
    volumes:
      - wg-config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

volumes:
  wg-config:
